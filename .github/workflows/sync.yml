name: Upstream Sync

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      redeploy:
        description: Deploy current main even if upstream is unchanged
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'leason-lyx/CF-Server-Monitor'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/huilang-me/CF-Server-Monitor.git
          git fetch --no-tags upstream main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Merge upstream while preserving deployment configuration
        id: sync
        run: bash .github/scripts/sync-upstream.sh
      - name: Push synchronized main
        if: steps.sync.outputs.changed == 'true'
        run: git push origin HEAD:main
      - name: Trigger Cloudflare production build
        if: steps.sync.outputs.changed == 'true' || inputs.redeploy == true
        env:
          CF_DEPLOY_HOOK_URL: ${{ secrets.CF_DEPLOY_HOOK_URL }}
        run: |
          test -n "$CF_DEPLOY_HOOK_URL"
          curl --fail --silent --show-error --max-time 60 --request POST "$CF_DEPLOY_HOOK_URL" --output /dev/null
          echo 'Cloudflare production build requested.' >> "$GITHUB_STEP_SUMMARY"
