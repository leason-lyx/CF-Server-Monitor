# Cloudflare deployment for leason-lyx/CF-Server-Monitor
name = "cf-server-monitor"
account_id = "cf35718d5b28b5d5d98ad30267f8e6e2"
workers_dev = false
preview_urls = false
routes = [{ pattern = "monitor.040803.xyz", custom_domain = true }, { pattern = "monitor-next.040803.xyz", custom_domain = true }, { pattern = "probe.040803.xyz", custom_domain = true }]
main = "src/index.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

keep_vars = true

# 定时任务配置（UTC）
# - 每分钟：执行离线节点、资源告警
# - 每小时：合并执行其他定时任务（表轮换、旧表清理、按配置时区/小时触发服务器到期检测）
# - 注意同步修改deploy和index.js scheduled函数里面的值
[triggers]
crons = ["*/1 * * * *", "0 * * * *"]

[assets]
directory = "./dist"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "cf-server-monitor-db"
database_id = "079599a7-9b30-4457-8b05-9995fa52c237"

# Durable Objects：实时指标广播中心
# 注意：首次部署前需要执行 `wrangler durable-object create MetricsBroadcaster --class MetricsBroadcaster`
# 或者在部署后，wrangler 会自动创建对应的 DO namespace。
[[durable_objects.bindings]]
name = "METRICS_BROADCASTER"
class_name = "MetricsBroadcaster"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MetricsBroadcaster"]

# 开发服务器配置
[dev]
port = 8787
local_protocol = "https"
